[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tieng-lang"
version = "4.0.0"
description = "Source-grounded, voice-first public-service access agent (Vietnamese). Preparation/MVP phase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tieng Lang Team" }]
keywords = ["voice", "rag", "public-service", "vietnamese", "accessibility"]

dependencies = [
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
cloud = ["google-genai>=1.0", "groq>=0.11"]
tts = ["edge-tts>=7.0"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that may download models or need network (deselect with -m 'not slow')",
    "gate: pilot-readiness gate tests (tests/gates)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
